name: Verify garden
on:
  push:
    branches: [main, codex/garden-defect-repairs-soundtrack]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Playwright 1.56 supports this image; ubuntu-latest can select Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: python3 tests/android-assets.test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-verification
          path: test-results/
          retention-days: 7
